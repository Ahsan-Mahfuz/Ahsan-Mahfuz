name: Refresh profile cards

# The stat counters and "updated N days ago" chips live inside generated SVGs,
# so they are re-rendered from the GitHub API twice a day.
#
# Deliberately not triggered by push: this workflow commits to main, and a push
# trigger would make it retrigger itself.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Fetch live numbers
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node fetch-data.mjs

      - name: Rebuild cards
        working-directory: tools
        run: node build-assets.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/data.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards with live GitHub data"
            git push
          fi
